openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: logistics
    description: Currency and route weather monitoring
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dados:
    get:
      operationId: getLogisticsData
      tags: [logistics]
      summary: Get current logistics data
      description: Fetches USD and EUR quotes and the current temperature for São Paulo.
      responses:
        "200":
          description: Current logistics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogisticsData"
        "502":
          description: Upstream data provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LogisticsData:
      type: object
      properties:
        dolar:
          type: string
        euro:
          type: string
        temperatura:
          type: [number, string]
        timestamp:
          type: string
      required:
        - dolar
        - euro
        - temperatura
        - timestamp
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

